<style>
:root{
  color-scheme:light;
  --ground:#F4F7F8; --surface:#FFFFFF; --ink:#10202A; --muted:#5E6E77; --faint:#8C9AA2;
  --line:#E2E8EB; --teal:#0E5E6F; --teal-2:#13798D; --teal-soft:#E0F0F2; --sun:#F2B705; --sun-soft:#FFF4CF;
  --live:#F0503F; --live-soft:#FDE6E3; --ok:#1E9E6A;
  --shadow:0 1px 2px rgba(16,32,42,.04),0 8px 24px rgba(16,32,42,.07);
  --shadow-lg:0 12px 40px rgba(16,32,42,.16);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* Shell */
.phone{height:100%;display:flex;align-items:center;justify-content:center}
.screen{width:100%;height:100%;background:var(--ground);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:520px) and (min-height:700px){
  body{background:radial-gradient(circle at 30% 20%,#DCEBEE,#C9D8DD 60%,#B9CBD1)}
  .phone{padding:20px}
  .screen{width:390px;height:min(844px,calc(100vh - 40px));border-radius:48px;box-shadow:0 0 0 11px #10202A,0 0 0 13px #3A4A52,0 40px 90px rgba(16,32,42,.35);padding-top:44px}
  .screen::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:50}
}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 18px 28px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.mapmode{padding:0;overflow:hidden;position:relative}

/* Bottom nav */
.nav{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin:0 12px calc(10px + env(safe-area-inset-bottom,0px));padding:6px;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--faint);padding:6px 0 4px;position:relative;z-index:1;transition:color .2s}
.nav button.on{color:var(--teal);font-weight:700}
.nav svg{width:22px;height:22px;transition:transform .25s var(--ease)}
.nav button.on svg{transform:translateY(-1px) scale(1.08)}
.nav .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:20px;background:var(--teal-soft);transition:transform .35s var(--ease);z-index:0}
.nav .plus span{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#FFC926,var(--sun));color:var(--ink);display:grid;place-items:center;margin-top:-2px;box-shadow:0 6px 16px rgba(242,183,5,.45);transition:transform .2s var(--ease)}
.nav .plus:active span{transform:scale(.9) rotate(90deg)}
.badge{position:absolute;top:2px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--live);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;animation:pop .4s var(--ease)}

/* Type */
h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.02;letter-spacing:-.02em;margin:4px 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:22px 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--faint);margin:0 0 8px}
.meta{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Controls */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-weight:700;background:var(--teal);color:#fff;box-shadow:0 6px 16px rgba(14,94,111,.25);transition:transform .15s var(--ease),box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 6px 16px rgba(242,183,5,.35)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.small{width:auto;padding:9px 14px;border-radius:12px;font-size:13px;box-shadow:none}
.link{background:none;border:0;color:var(--teal);font-weight:700;padding:6px 0}
.back{background:var(--surface);border:1px solid var(--line);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.back:active{transform:scale(.92)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap;transition:all .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.live{border-color:var(--live-soft);background:var(--live-soft);color:var(--live);font-weight:700}
.chip.live.on{background:var(--live);border-color:var(--live);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#E8EEF0;border-radius:14px;padding:4px;margin:14px 0 12px;position:relative}
.seg button{border:0;background:none;border-radius:10px;padding:8px 0;font-size:13px;position:relative;z-index:1;color:var(--muted);transition:color .2s}
.seg button.on{color:var(--ink);font-weight:700}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--surface);border-radius:10px;box-shadow:0 1px 3px rgba(16,32,42,.12);transition:transform .35s var(--ease)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.search{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);width:100%;transition:border-color .2s,box-shadow .2s}
.field input:focus,.search:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Sliders */
.sliders{display:grid;gap:18px;background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sl .top b{font-size:14px}
.sl .val{font-family:var(--display);font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums;transition:transform .15s}
.sl .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal) var(--p,50%),#E4EAED var(--p,50%));outline:none;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 6px rgba(14,94,111,.14),0 2px 6px rgba(16,32,42,.3);transition:box-shadow .2s,transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15);box-shadow:0 0 0 10px rgba(14,94,111,.16),0 2px 6px rgba(16,32,42,.3)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 6px rgba(14,94,111,.14),0 2px 6px rgba(16,32,42,.3)}

/* Onboarding */
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps i{flex:1;height:5px;border-radius:3px;background:#E1E8EB;overflow:hidden;position:relative}
.steps i.on::after{content:"";position:absolute;inset:0;background:var(--teal);animation:grow .5s var(--ease) both}
.hero-ob{border-radius:26px;padding:22px;margin:0 0 20px;color:#fff;background:linear-gradient(145deg,#0E5E6F,#13798D 55%,#2A9BA8);position:relative;overflow:hidden}
.hero-ob h2{color:#fff}
.hero-ob p{margin:0;opacity:.85}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;animation:float 7s ease-in-out infinite}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.mebtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--sun);font-weight:800;font-family:var(--display);box-shadow:var(--shadow);transition:transform .15s}
.mebtn:active{transform:scale(.92)}
.typebadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--sun-soft);color:#6B5000}

/* Live strip */
.livestrip{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:4px 18px 10px;scrollbar-width:none}
.livestrip::-webkit-scrollbar{display:none}
.livecard{flex:0 0 200px;border:0;text-align:left;border-radius:18px;padding:12px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.livecard:active{transform:scale(.97)}
.livecard b{display:block;font-family:var(--display);font-size:15px;line-height:1.15;margin:8px 0 2px}
.livecard span{font-size:12px;opacity:.9}
.livecard svg.bg{position:absolute;right:-10px;bottom:-12px;width:80px;height:80px;opacity:.25}
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.06em;background:rgba(255,255,255,.95);color:var(--live);border-radius:999px;padding:3px 8px}
.livedot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}

/* Cards */
.day{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--faint);margin:20px 0 10px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:22px;padding:0;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s}
.card:active{transform:scale(.98)}
.cover{height:86px;position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding:12px;overflow:hidden}
.cover svg.ic{position:absolute;right:14px;bottom:-14px;width:96px;height:96px;opacity:.35;color:#fff;transition:transform .5s var(--ease)}
.card:hover .cover svg.ic{transform:rotate(-8deg) scale(1.06)}
.pilltag{font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px;background:rgba(255,255,255,.92);color:var(--ink);backdrop-filter:blur(6px)}
.match{font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 9px;background:var(--ink);color:#fff;font-variant-numeric:tabular-nums}
.cbody{padding:12px 14px 14px}
.cbody h4{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 3px;line-height:1.15;letter-spacing:-.01em}
.price{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.price.free{color:var(--ok)}
.going{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.going b{color:var(--ink)}
.stack{display:flex}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);border:2px solid var(--surface);flex:none;position:relative}
.stack .av+.av{margin-left:-9px}
.av.lg{width:48px;height:48px;font-size:16px;border:0}
.av.xl{width:88px;height:88px;font-size:30px;border:0;font-family:var(--display)}
.av .on{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.vb{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--teal);color:#fff;vertical-align:-2px;margin-left:4px}
.vb svg{width:10px;height:10px}
.av .vtick{position:absolute;right:-2px;top:-2px;width:16px;height:16px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;border:2px solid var(--surface)}
.av .vtick svg{width:8px;height:8px}
.filterbtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:11px 14px;box-shadow:var(--shadow);margin:2px 0 6px;font-size:13.5px;text-align:left}
.filterbtn b{font-weight:700}
.filterbtn .n{margin-left:auto;background:var(--teal);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px}
.vstep{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.vstep:last-child{border-bottom:0}
.vstep .num{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--ground);font-weight:700;flex:none;color:var(--muted)}
.vstep.ok .num{background:var(--teal);color:#fff}
.vstep .who{flex:1;min-width:0}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--teal);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.joined{font-size:11.5px;font-weight:700;color:var(--teal);display:inline-flex;align-items:center;gap:4px}

/* Detail */
.dhero{margin:-12px -18px 0;height:220px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:14px 18px 40px;overflow:hidden}
.dhero svg.ic{position:absolute;right:-20px;bottom:-30px;width:200px;height:200px;opacity:.28;color:#fff;animation:drift 9s ease-in-out infinite}
.dhero .row{position:relative}
.dcard{background:var(--surface);border-radius:26px 26px 0 0;margin:-26px -18px 0;padding:22px 18px 0;position:relative}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.fact{background:var(--ground);border-radius:16px;padding:10px 12px}
.fact small{display:block;color:var(--faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.fact b{font-size:14px}
.meter{height:8px;border-radius:4px;background:#E4EAED;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-2));border-radius:4px;animation:grow .9s var(--ease) both}
.why{background:var(--teal-soft);border-radius:16px;padding:12px 14px;font-size:13.5px;margin:12px 0}
.why b{color:var(--teal)}
.person{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .who{flex:1;min-width:0}
.person .who b{display:block}
.shared{font-size:12px;color:var(--teal);font-weight:500}
.sticky-cta{position:sticky;bottom:-28px;background:linear-gradient(rgba(255,255,255,0),#fff 35%);padding:22px 0 10px;display:grid;gap:8px;margin:0 -18px;padding-left:18px;padding-right:18px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 0}
.list{background:var(--surface);border-radius:20px;padding:4px 14px;box-shadow:var(--shadow)}

/* Chat */
.chathead{display:flex;align-items:center;gap:10px;padding:6px 16px 12px;background:var(--ground);border-bottom:1px solid var(--line)}
.chathead .t{flex:1;min-width:0}
.chathead b{display:block;font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{background:var(--sun-soft);border-radius:16px;padding:10px 12px;font-size:13px;margin:6px 0 12px}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 13px;border-radius:20px;background:var(--surface);font-size:14px;box-shadow:0 1px 2px rgba(16,32,42,.06);animation:msgin .35s var(--ease) both}
.msg small{display:block;font-size:11px;font-weight:700;color:var(--teal)}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:6px}
.msg.them{border-bottom-left-radius:6px;align-self:flex-start}
.sys{align-self:center;font-size:12px;color:var(--faint);text-align:center}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{background:var(--ground);padding:8px 12px 10px;border-top:1px solid var(--line)}
.composer form{display:flex;gap:8px;margin-top:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--surface)}
.composer button[type=submit]{border:0;border-radius:50%;width:44px;height:44px;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s}
.composer button[type=submit]:active{transform:scale(.9)}

/* Quiz */
.qwrap{min-height:100%;display:flex;flex-direction:column}
.qprog{height:6px;border-radius:3px;background:#E1E8EB;overflow:hidden;margin:10px 0 26px}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FF9F1C);border-radius:3px;transition:width .45s var(--ease)}
.qopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow);font-weight:700;font-size:16px;transition:transform .2s var(--ease),border-color .2s}
.qopt:active{transform:scale(.97)}
.qopt.pick{border-color:var(--teal);background:var(--teal-soft)}
.qopt .em{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.result{border-radius:28px;padding:26px 22px;color:#fff;text-align:center;position:relative;overflow:hidden;animation:reveal .7s var(--ease) both}
.result h2{color:#fff;font-size:36px}
.traits{display:grid;gap:12px;margin:18px 0}
.trait .row{font-size:13px;margin-bottom:4px}

/* Map */
#map{position:absolute;inset:0;background:#E8EEF0}
.mapbar{position:absolute;top:10px;left:0;right:0;z-index:500;padding:0 14px;display:grid;gap:8px}
.mapbar .glass{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center}
.mapbar .glass b{font-family:var(--display);font-size:18px}
.mapbar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.mapbar .chip{box-shadow:var(--shadow)}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden;animation:sheet .45s var(--ease) both}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.pinm{width:40px;height:40px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 4px 10px rgba(16,32,42,.3);border:3px solid #fff;transition:transform .25s var(--ease)}
.pinm svg{transform:rotate(45deg);width:20px;height:20px;color:#fff}
.pinwrap{position:relative;animation:drop .6s var(--ease) both}
.pinwrap.sel .pinm{transform:rotate(-45deg) scale(1.25)}
.pinwrap.live::before{content:"";position:absolute;left:-6px;top:-6px;width:52px;height:52px;border-radius:50%;background:var(--live);opacity:.35;animation:ring 1.8s ease-out infinite}
.leaflet-container{font-family:var(--body)}
.mapfail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}

/* Friends */
.req{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;display:grid;place-items:center;transition:transform .15s}
.iconbtn:active{transform:scale(.9)}
.iconbtn.yes{background:var(--teal);color:#fff}.iconbtn.no{background:#EDF1F3;color:var(--muted)}
.fprofile{text-align:center;padding-top:6px}
.fprofile .av{margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{background:var(--surface);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.stats b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;accent-color:var(--teal)}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}

/* Toast & confetti */
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:900;background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:500;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow-lg);animation:toast .45s var(--ease) both}
@media (min-width:520px) and (min-height:700px){.toast{top:52px}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:950;overflow:hidden}
.confetti i{position:absolute;width:8px;height:12px;border-radius:2px;animation:confetti 1.1s var(--ease) forwards}

/* Motion */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:.2;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:.3}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,80,63,.6)}100%{box-shadow:0 0 0 8px rgba(240,80,63,0)}}
@keyframes ring{0%{transform:scale(.5);opacity:.5}100%{transform:scale(1.6);opacity:0}}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}60%{transform:translateY(3px);opacity:1}100%{transform:none}}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-10px)}}
@keyframes drift{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(4deg) translateY(-6px)}}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bounce{0%,60%,100%{transform:none}30%{transform:translateY(-5px)}}
@keyframes reveal{0%{opacity:0;transform:scale(.8) rotate(-3deg)}100%{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(120%)}to{transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes confetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.view.enter-fwd{animation:slidein .38s var(--ease)}
.view.enter-tab{animation:fadein .3s ease}
.view .st{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:519px){.field input,.field select,.composer input,.search{font-size:16px}}
</style>

  interests:new Set(["Gym","Gaming","Sports watching","Startups & career"]),
  pref:{budget:15,out:55,size:6,energy:60,dist:6},
  type:null,traits:null,quiz:{i:0,e:0,n:0,p:0,d:0,picks:[]},
  seg:"all",cat:"For you",mapFilter:"live",mapSel:null,cur:null,friendView:null,
  joined:new Set(["p0"]),events:SEED.map(e=>({...e,going:[...e.going]})),chats:JSON.parse(JSON.stringify(CHATS)),
  friends:{lu:{together:2},ma:{together:1},an:{together:1}},requests:["de","ju"],sent:new Set(),
  unread:new Set(),draft:null,fsearch:""});
let S=fresh();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ev=id=>S.events.find(e=>e.id===id);
const initials=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const isFriend=k=>!!S.friends[k];
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>';
const verifiedMe=()=>S.ver.email&&S.ver.photo;
const vbadge=k=>(k==="me"?verifiedMe():PEOPLE[k].ver)?`<span class="vb" title="Verified">${TICK}</span>`:"";
const av=(k,cls="",dot=false)=>{
  const v=(k==="me"?verifiedMe():PEOPLE[k].ver)&&/lg|xl/.test(cls)?`<i class="vtick">${TICK}</i>`:"";
  return k==="me"?`<span class="av ${cls}" style="background:var(--sun)">${esc(initials(S.name))}${v}</span>`:
  `<span class="av ${cls}" style="background:${PEOPLE[k].color}">${initials(PEOPLE[k].name)}${dot&&PEOPLE[k].online?'<i class="on"></i>':""}${v}</span>`};
const GENDER=[["any","Anyone"],["mixed","Mixed groups"],["f","Mostly women"],["m","Mostly men"]];
function passFilters(e){
  const f=S.filters, g=e.going;
  if(f.verified&&g.some(k=>!PEOPLE[k].ver))return false;
  if(g.length){
    if(!g.some(k=>PEOPLE[k].age>=f.ageMin&&PEOPLE[k].age<=f.ageMax))return false;
    if(f.gender!=="any"){
      const w=g.filter(k=>PEOPLE[k].g==="f").length, m=g.length-w;
      if(f.gender==="f"&&w<m)return false;
      if(f.gender==="m"&&m<w)return false;
      if(f.gender==="mixed"&&(w===0||m===0))return false;
    }
  }
  return true;
}
const activeFilters=()=>{const f=S.filters;let n=0;if(f.ageMin!==18||f.ageMax!==30)n++;if(f.gender!=="any")n++;if(f.verified)n++;return n};
const ageRange=e=>{const a=e.going.map(k=>PEOPLE[k].age);return a.length?(Math.min(...a)===Math.max(...a)?`Age ${a[0]}`:`Ages ${Math.min(...a)}-${Math.max(...a)}`):"Open to all ages"};
const hostName=e=>PEOPLE[e.host]?PEOPLE[e.host].name:e.host==="me"?"You":e.host;
const sharedWith=k=>PEOPLE[k].int.filter(i=>S.interests.has(i));
const priceTxt=e=>e.price===0?(e.full?`Free for students`:"Free"):e.full?`€${e.price} students`:`€${e.price}`;
const setWord=v=>v<35?"Mostly indoor":v>65?"Mostly outdoor":"Indoor or outdoor";
const energyWord=v=>v<35?"Chill":v>65?"Active":"Balanced";

function score(e){
  let s=S.interests.has(e.cat)?40:12;
  s+=e.price<=S.pref.budget?20:Math.max(0,20-(e.price-S.pref.budget)*2);
  s+=15*(1-Math.abs(S.pref.out-(e.set==="out"?85:15))/100);
  s+=10*(1-Math.min(1,Math.abs(Math.log(e.cap)-Math.log(S.pref.size))/2.2));
  s+=10*(1-Math.abs(S.pref.energy-e.energy)/100);
  if(S.type&&e.going.length){s+=e.going.reduce((a,k)=>a+COMPAT[S.type][PEOPLE[k].type],0)/e.going.length;}
  else s+=5;
  s+=e.going.some(isFriend)?3:0;
  return Math.max(35,Math.min(98,Math.round(s)));
}
function reasons(e){
  const r=[];
  if(S.interests.has(e.cat))r.push(`you like <b>${esc(e.cat)}</b>`);
  if(e.price<=S.pref.budget)r.push(`it fits your <b>€${S.pref.budget}</b> budget`);
  if(Math.abs(Math.log(e.cap)-Math.log(S.pref.size))<.8)r.push(`the group size suits you`);
  const fr=e.going.filter(isFriend);if(fr.length)r.push(`<b>${fr.map(k=>PEOPLE[k].name).join(", ")}</b> ${fr.length>1?"are":"is"} going`);
  if(S.type){const good=e.going.filter(k=>COMPAT[S.type][PEOPLE[k].type]>=8);if(good.length)r.push(`${good.length} ${good.length>1?"people click":"person clicks"} with your <b>${S.type}</b> vibe`);}
  return r;
}

function toast(m){$("#toastHost").innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>$("#toastHost").innerHTML="",2400)}
function confetti(){
  const box=document.createElement("div");box.className="confetti";
  const cols=["#F2B705","#0E5E6F","#F0503F","#2DB3B4","#A27BF0","#43C08A"];
  for(let i=0;i<46;i++){const c=document.createElement("i");const a=Math.random()*Math.PI*2,d=120+Math.random()*220;
    c.style.cssText=`left:50%;top:45%;background:${cols[i%6]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d+140}px;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*80}ms`;box.appendChild(c)}
  $("#screen").appendChild(box);setTimeout(()=>box.remove(),1300);
}
const slider=(id,label,min,max,step,val,fmt,l,r)=>`<div class="sl"><div class="top"><b>${label}</b><span class="val" id="v-${id}">${fmt(val)}</span></div>
  <input type="range" id="r-${id}" data-pref="${id}" min="${min}" max="${max}" step="${step}" value="${val}" style="--p:${(val-min)/(max-min)*100}%" aria-label="${label}">
  <div class="ends"><span>${l}</span><span>${r}</span></div></div>`;
const FMT={budget:v=>v==0?"Free only":v>=60?"Any":`Up to €${v}`,out:v=>setWord(v),size:v=>v>=20?"20+ people":`${v} people`,energy:v=>energyWord(v),dist:v=>`${v} km`};
const prefSliders=()=>`<div class="sliders">
  ${slider("budget","Budget per activity",0,60,5,S.pref.budget,FMT.budget,"Free","€60+")}
  ${slider("out","Where you like to be",0,100,5,S.pref.out,FMT.out,"Inside","Outside")}
  ${slider("size","Preferred group size",2,20,1,S.pref.size,FMT.size,"Just 2","Big crowd")}
  ${slider("energy","Energy level",0,100,5,S.pref.energy,FMT.energy,"Chill","Active")}
  ${slider("dist","How far you'll go",1,15,1,S.pref.dist,FMT.dist,"Nearby","Whole city")}
</div>`;

const TABS=["discover","map","create","chats","friends"];
function renderNav(){
  const tab={discover:"discover",event:S.prevTab,map:"map",chats:"chats",chat:"chats",after:"chats",create:"create",friends:"friends",friend:"friends",profile:"discover",quiz:"discover",result:"discover",filters:"discover",verify:"discover"}[S.screen];
  if(["onboard","quiz","result"].includes(S.screen)&&!S.done){$("#nav").hidden=true;return}
  $("#nav").hidden=false;
  const idx=Math.max(0,TABS.indexOf(tab));
  const nreq=S.requests.length;
  $("#nav").innerHTML=`<span class="pill" style="transform:translateX(${idx*100}%);${tab==="create"?"opacity:0":""}"></span>`+[["discover","Discover"],["map","Map"],["create",""],["chats","Chats"],["friends","Friends"]].map(([k,l])=>
    k==="create"?`<button class="plus" data-go="create" aria-label="Create a plan"><span>${ICON.create}</span></button>`:
    `<button data-go="${k}" class="${tab===k?"on":""}">${ICON[k]}${l}${k==="chats"&&S.unread.size?`<i class="badge">${S.unread.size}</i>`:""}${k==="friends"&&nreq?`<i class="badge">${nreq}</i>`:""}</button>`).join("");
}

function card(e,i=0){
  const n=e.going.length+(S.joined.has(e.id)?1:0), fr=e.going.filter(isFriend);
  return `<button class="card st" style="--i:${i}" data-go="event" data-id="${e.id}">

/* ---------- Map ---------- */
let MAP=null;
function mapEvents(){
  const f=S.mapFilter;let l=S.events.filter(e=>!e.past&&passFilters(e));
  if(f==="live")l=l.filter(e=>e.live);
  if(f==="today")l=l.filter(e=>e.day==="Thu 17 Sep");
  if(f==="match")l=l.filter(e=>score(e)>=70);
  return l;
}
function initMap(){
  if(MAP){MAP.remove();MAP=null}
  const el=$("#map");if(!el)return;
  if(typeof L==="undefined"){el.innerHTML=`<div class="mapfail"><div><h3>Map unavailable offline</h3><p>Connect to the internet to load the Barcelona map.</p></div></div>`;renderSheet();return}
  MAP=L.map(el,{zoomControl:false,attributionControl:true}).setView([41.395,2.168],13);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(MAP);
  const evs=mapEvents(),pts=[];
  evs.forEach((e,i)=>{
    const icon=L.divIcon({className:"",iconSize:[40,40],iconAnchor:[6,40],html:`<div class="pinwrap ${e.live?"live":""} ${S.mapSel===e.id?"sel":""}" style="animation-delay:${i*70}ms" data-pin="${e.id}"><div class="pinm" style="${grad(e.cat)}">${svg(CAT[e.cat][0])}</div></div>`});
    L.marker(e.ll,{icon}).addTo(MAP).on("click",()=>{S.mapSel=e.id;document.querySelectorAll(".pinwrap").forEach(p=>p.classList.toggle("sel",p.dataset.pin===e.id));MAP.panTo([e.ll[0]-.006,e.ll[1]],{animate:true});renderSheet()});
    pts.push(e.ll);
  });
  L.circleMarker([41.3884,2.1150],{radius:8,color:"#fff",weight:3,fillColor:"#1F4FB0",fillOpacity:1}).addTo(MAP).bindTooltip("You · ESADE campus");
  if(pts.length>1)MAP.fitBounds(pts,{padding:[70,90]});else if(pts.length)MAP.setView(pts[0],15);
  if(S.mapSel&&!evs.find(e=>e.id===S.mapSel))S.mapSel=null;
  renderSheet();
  setTimeout(()=>MAP&&MAP.invalidateSize(),50);
}
function renderSheet(){
  const h=$("#sheetHost");if(!h)return;
  const e=S.mapSel&&ev(S.mapSel);
  if(!e){const n=mapEvents().length;h.innerHTML=`<div class="sheet"><div class="grab"></div><div style="padding:12px 16px 16px" class="row"><div><b style="font-family:var(--display);font-size:17px">${n} ${n===1?"place":"places"} on the map</b><div class="meta">Tap a pin to see what's happening</div></div><span class="livedot" style="background:var(--live-soft)">${S.events.filter(x=>x.live).length} LIVE</span></div></div>`;return}
  h.innerHTML=`<div class="sheet" key="${e.id}"><div class="grab"></div>
    <div style="display:flex;gap:12px;padding:12px 14px 14px;align-items:center">
      <span class="av lg" style="${grad(e.cat)};border-radius:16px;color:#fff;width:56px;height:56px">${svg(CAT[e.cat][0]).replace('<svg','<svg width="28" height="28"')}</span>
      <div style="flex:1;min-width:0"><div class="row" style="justify-content:flex-start;gap:6px">${e.live?'<span class="livedot" style="background:var(--live-soft)">LIVE</span>':`<span class="meta">${esc(e.day)}</span>`}<span class="match">${score(e)}%</span></div>
        <b style="display:block;font-family:var(--display);font-size:16px;line-height:1.2;margin-top:3px">${esc(e.title)}</b>
        <span class="meta">${esc(e.time)} · ${priceTxt(e)} · ${e.going.length+(S.joined.has(e.id)?1:0)} going</span></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px"><button class="btn ghost" data-go="event" data-id="${e.id}">Details</button>
    ${S.joined.has(e.id)?`<button class="btn" data-go="chat" data-id="${e.id}">Open chat</button>`:`<button class="btn" data-act="joinFromMap" data-v="${e.id}">${e.live?"Join now":"Join"}</button>`}</div></div>`;
}

/* ---------- Render / navigation ---------- */
function render(anim){
  const v=$("#view");
  document.querySelectorAll(".chathead").forEach(n=>n.remove());
  v.classList.toggle("mapmode",S.screen==="map");
  if(S.screen!=="map"&&MAP){MAP.remove();MAP=null}
  if(S.screen==="chat"){
    const e=ev(S.cur);
    v.innerHTML=V.chat();
    $("#composer").innerHTML=`<div class="composer"><div class="chips scroll" style="margin:0 -12px;padding:0 12px">${["Hi! I'm new in Barcelona","Anyone want to meet 10 min before?","Is it beginner friendly?","What should I bring?"].map(s=>`<button class="chip" data-act="quick" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <form id="chatForm"><input id="chat-in" placeholder="Message the group…" autocomplete="off"><button type="submit" aria-label="Send">${ICON.send}</button></form></div>`;
    v.insertAdjacentHTML("beforebegin",`<div class="chathead"><button class="back" data-act="back" aria-label="Back">${ICON.back}</button><span class="av lg" style="${grad(e.cat)};border-radius:14px;color:#fff;width:40px;height:40px">${svg(CAT[e.cat][0]).replace('<svg','<svg width="20" height="20"')}</span><div class="t"><b>${esc(e.title)}</b><span class="meta">${e.going.length+1} people · ${esc(e.day)}</span></div><button class="chip" data-go="event" data-id="${e.id}">Info</button></div>`);
    requestAnimationFrame(()=>v.scrollTop=v.scrollHeight);
  }else{
    $("#composer").innerHTML="";
    v.innerHTML=V[S.screen]();
    if(anim)v.scrollTop=0;
    if(S.screen==="map")initMap();
  }
  if(anim){v.classList.remove("enter-fwd","enter-tab");void v.offsetWidth;v.classList.add(anim==="tab"?"enter-tab":"enter-fwd")}
  renderNav();
}
function go(screen,id){
  const tabs=["discover","map","chats","friends","create"];
  if(screen==="create"&&S.screen!=="create")S.draft=S.draft&&S.draft.keep?{...S.draft,keep:false}:null;
  if(screen==="friend")S.friendView=id;
  else if(id)S.cur=id;
  if(tabs.includes(screen)){S.hist=[];if(screen!=="create")S.prevTab=screen}
  else S.hist.push({screen:S.screen,cur:S.cur,friendView:S.friendView});
  if(screen==="chat"){S.joined.add(id);S.unread.delete(id)}
  S.screen=screen;render(tabs.includes(screen)?"tab":"fwd");
}
function back(){
  const h=S.hist.pop();
  if(!h){S.screen=S.prevTab;render("tab");return}
  S.screen=h.screen;S.cur=h.cur;S.friendView=h.friendView;render("tab");
}
function say(text){
  const id=S.cur;const c=(S.chats[id]=S.chats[id]||[]);c.push({p:"me",t:text});
  const e=ev(id);
  if(e.going.length){c.push({typing:true})}
  render();
  if(!e.going.length)return;
  setTimeout(()=>{const i=c.findIndex(x=>x.typing);if(i>-1)c.splice(i,1);const k=e.going[Math.floor(Math.random()*e.going.length)];c.push({p:k,t:REPLIES[Math.floor(Math.random()*REPLIES.length)]});
    if(S.screen==="chat"&&S.cur===id)render();else{S.unread.add(id);renderNav()}},1500);
}
function joinEvent(e){
  if(e.going.length+1>e.cap){toast("This one is full. Try starting a similar plan.");return false}
  S.joined.add(e.id);(S.chats[e.id]=S.chats[e.id]||[]).push({sys:`${S.name} joined the group`});
  confetti();return true;
}
function saveIdentity(){
  const g=(id,d)=>{const el=$(id);return el?(el.value.trim()||d):d};
  S.name=g("#f-name",S.name);S.doing=g("#f-doing",S.doing);S.home=g("#f-home",S.home);
  const a=$("#f-age");if(a&&+a.value>=16&&+a.value<=90)S.age=+a.value;
}
function befriend(k){S.friends[k]=S.friends[k]||{together:0};S.requests=S.requests.filter(x=>x!==k);S.sent.delete(k)}

document.addEventListener("click",evt=>{
  const g=evt.target.closest("[data-go]");
  if(g&&!g.disabled){go(g.dataset.go,g.dataset.id);return}
  const a=evt.target.closest("[data-act]");if(!a)return;
  const v=a.dataset.v, e=S.cur&&ev(S.cur);
  switch(a.dataset.act){
    case"back":back();break;
    case"interest":{saveIdentity();S.interests.has(v)?S.interests.delete(v):S.interests.add(v);
      a.classList.toggle("on");const lab=$("#intlabel");if(S.screen==="onboard"&&lab)lab.textContent=`Your interests · ${S.interests.size} selected`;break}
    case"step":{saveIdentity();S.step=+v;render("fwd");break}
    case"startQuiz":S.quiz={i:0,e:0,n:0,p:0,d:0,picks:[]};S.screen="quiz";render("fwd");break;
    case"answer":{a.classList.add("pick");const w=QUIZ[S.quiz.i].a[+v][2];["e","n","p","d"].forEach(k=>S.quiz[k]+=w[k]||0);S.quiz.picks.push(w);
      const bar=document.querySelector(".qprog i");if(bar)bar.style.width=((S.quiz.i+1)/QUIZ.length*100)+"%";
      setTimeout(()=>{S.quiz.i++;if(S.quiz.i>=QUIZ.length){
        S.traits={e:pct("e",S.quiz.e),n:pct("n",S.quiz.n),p:pct("p",S.quiz.p),d:pct("d",S.quiz.d)};
        S.type=S.traits.e>=50?(S.traits.n>=50?"Spark":"Host"):(S.traits.n>=50?"Explorer":"Anchor");
        S.screen="result";render("fwd");confetti()}else render("fwd")},320);break}
    case"quizBack":if(S.quiz.i===0){S.screen=S.done?"profile":"onboard";render("tab")}else{const w=S.quiz.picks.pop();["e","n","p","d"].forEach(k=>S.quiz[k]-=w[k]||0);S.quiz.i--;render("tab")}break;
    case"finishOnboard":saveIdentity();S.done=true;S.cat="For you";S.hist=[];S.screen="discover";S.prevTab="discover";render("fwd");toast(`Welcome, ${S.name}! Here's your week.`);break;
    case"goProfile":S.screen="profile";S.hist=[];render("tab");break;
    case"seg":S.seg=v;render();break;
    case"cat":S.cat=v;render();break;
    case"mapLive":S.mapFilter="live";S.mapSel=null;go("map");break;
    case"mapFilter":S.mapFilter=v;S.mapSel=null;document.querySelectorAll(".mapbar .chip").forEach(c=>c.classList.toggle("on",c.dataset.v===v));initMap();break;
    case"joinFromMap":{const x=ev(v);if(joinEvent(x)){toast(`You're in: ${x.title}`);renderSheet()}break}
    case"join":if(joinEvent(e)){toast("You're in. Say hi to the group!");setTimeout(()=>go("chat",e.id),650)}break;
    case"leave":S.joined.delete(e.id);render();toast("You left this activity");break;
    case"quick":say(v);break;
    case"addFriend":S.sent.add(v);render();toast(`Friend request sent to ${PEOPLE[v].name}`);
      setTimeout(()=>{if(S.sent.has(v)){befriend(v);toast(`${PEOPLE[v].name} accepted your request`);if(!["chat","onboard","quiz","result"].includes(S.screen)&&S.screen!=="map")render();else renderNav()}},2600);break;
    case"accept":befriend(v);render();toast(`You and ${PEOPLE[v].name} are now friends`);confetti();break;
    case"decline":S.requests=S.requests.filter(x=>x!==v);render();break;
    case"keep":document.querySelectorAll("[data-keep]").forEach(c=>{if(c.checked){const k=c.dataset.keep;befriend(k);S.friends[k].together=Math.max(S.friends[k].together,1)}});S.hist=[];S.screen="friends";render("tab");toast("Added to your friends");confetti();break;
    case"againFrom":{const ks=[...document.querySelectorAll("[data-keep]")].filter(c=>c.checked).map(c=>c.dataset.keep);ks.forEach(befriend);
      S.draft={title:"Same crew, round two?",cat:e.cat,day:"Sat 19 Sep",time:e.time,place:e.place,invite:ks,set:e.set,keep:true};go("create");break}
    case"invite":S.draft={invite:[v],keep:true};go("create");break;
    case"toggleInvite":{S.draft=S.draft||{};const s=new Set(S.draft.invite||[]);s.has(v)?s.delete(v):s.add(v);S.draft.invite=[...s];a.classList.toggle("on");break}
    case"tpl":{const t=[["Walk around the city","Walks & outdoors","Sun 20 Sep","11:00","Passeig de Gràcia","out"],["Football tonight","Sports","Thu 17 Sep","20:00","Camp Joan Miró","out"],["Grab a coffee","Food & drinks","Fri 18 Sep","16:00","Near campus","in"],["Watch the match together","Sports watching","Sat 19 Sep","18:30","Bar in Poble-sec","in"],["Gym session","Gym","Fri 18 Sep","08:00","DiR Diagonal","in"]][+v];
      S.draft={...(S.draft||{}),title:t[0]+", who's in?",cat:t[1],day:t[2],time:t[3],place:t[4],set:t[5]};render();break}
    case"gender":S.filters.gender=v;document.querySelectorAll('[data-act="gender"]').forEach(c=>c.classList.toggle("on",c.dataset.v===v));render();break;
    case"verOnly":S.filters.verified=$("#f-ver").checked;render();break;
    case"resetFilters":S.filters={ageMin:18,ageMax:30,gender:"any",verified:false};render();toast("Filters reset");break;
    case"doVerify":{const k=v;a.outerHTML='<span class="spin"></span>';
      setTimeout(()=>{S.ver[k]=true;const was=verifiedMe();render();
        toast(k==="email"?"Student email verified":k==="photo"?"Selfie check passed":"Phone number verified");
        if(was&&k!=="phone")confetti()},1400);break}
    case"reset":if(MAP){MAP.remove();MAP=null}S=fresh();render("tab");break;
  }
});
document.addEventListener("input",evt=>{
  const t=evt.target;
  if(t.type==="range"){
    const min=+t.min,max=+t.max,val=+t.value;t.style.setProperty("--p",(val-min)/(max-min)*100+"%");
    const k=t.id.slice(2),out=$("#v-"+k);
    if(t.dataset.filter){
      S.filters[t.dataset.filter]=val;
      if(S.filters.ageMin>S.filters.ageMax){if(t.dataset.filter==="ageMin")S.filters.ageMax=val;else S.filters.ageMin=val;
        const other=$(t.dataset.filter==="ageMin"?"#r-ageMax":"#r-ageMin");if(other){other.value=val;other.style.setProperty("--p",(val-16)/24*100+"%")}}
      const o=$("#v-ageMin");if(o)o.textContent=`${S.filters.ageMin} - ${S.filters.ageMax}${S.filters.ageMax>=40?"+":""}`;
    }
    else if(t.dataset.pref){S.pref[k]=val;if(out)out.textContent=FMT[k](val)}
    else if(k==="cap"){S.draft=S.draft||{};S.draft.cap=val;if(out)out.textContent=val+" people"}
  }
  if(["f-name","f-doing","f-home","f-age"].includes(t.id)&&S.screen==="profile"){
    if(t.id==="f-age"){if(+t.value>=16&&+t.value<=90)S.age=+t.value}
    else{const map={"f-name":"name","f-doing":"doing","f-home":"home"};if(t.value.trim())S[map[t.id]]=t.value.trim()}
    const h=document.querySelector(".fprofile h2");if(h&&t.id!=="f-doing"&&t.id!=="f-home")h.innerHTML=`${S.name}, ${S.age}${vbadge("me")}`;
  }
  if(t.id==="fsearch"){S.fsearch=t.value;const pos=t.selectionStart;render();const n=$("#fsearch");n.focus();n.setSelectionRange(pos,pos)}
  if(t.id&&t.id.startsWith("c-")&&t.id!=="c-cap"){S.draft=S.draft||{};const map={"c-title":"title","c-cat":"cat","c-set":"set","c-day":"day","c-time":"time","c-place":"place"};if(map[t.id])S.draft[map[t.id]]=t.value}
});
document.addEventListener("submit",f=>{
  f.preventDefault();
  if(f.target.id==="chatForm"){const i=$("#chat-in");if(i.value.trim())say(i.value.trim());return}
  if(f.target.id==="createForm"){
    const id="u"+Date.now(), inv=(S.draft&&S.draft.invite)||[];
    const LL={"Passeig de Gràcia":[41.3935,2.1635],"Camp Joan Miró":[41.3775,2.1480]};
    const place=$("#c-place").value.trim();
    const p={id,kind:"plan",cat:$("#c-cat").value,title:$("#c-title").value.trim(),day:$("#c-day").value,time:$("#c-time").value,place,
      ll:LL[place]||[41.39+Math.random()*.02,2.15+Math.random()*.03],price:0,cap:(S.draft&&S.draft.cap)||6,set:$("#c-set").value,energy:S.pref.energy,going:[...inv],host:"me",desc:"A casual plan started by "+S.name+"."};
    S.events.unshift(p);S.joined.add(id);
    S.chats[id]=[{sys:"You started this plan"},...(inv.length?[{sys:"Invited "+inv.map(k=>PEOPLE[k].name).join(", ")}]:[])];
    inv.forEach(k=>{S.friends[k].together++});
    S.draft=null;confetti();go("chat",id);toast(inv.length?"Plan posted and invites sent":"Plan posted. People who match will see it");
  }
});
render("tab");
</script>
</body>
